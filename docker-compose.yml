services:
  epadd:
    build:
      context: .
      dockerfile: Dockerfile
    image: epadd:local
    container_name: epadd
    restart: unless-stopped
    ports:
      - "${EPADD_BIND_ADDRESS:-127.0.0.1}:${EPADD_PORT:-8080}:8080"
    environment:
      EPADD_MODE: ${EPADD_MODE:-appraisal}
      EPADD_LANGUAGE: ${EPADD_LANGUAGE:-en}
      EPADD_ADMIN_CONTACT: ${EPADD_ADMIN_CONTACT:-}
      EPADD_JAVA_OPTS: ${EPADD_JAVA_OPTS:--Xmx4g}
    volumes:
      - epadd-repos:/data/repos
      - epadd-settings:/data/settings
      - epadd-config:/data/config
      - epadd-logs:/data/logs
    mem_limit: ${EPADD_MEM_LIMIT:-6g}
    init: true
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  epadd-repos:
  epadd-settings:
  epadd-config:
  epadd-logs:
